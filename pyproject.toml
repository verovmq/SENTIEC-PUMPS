[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bombas"
version = "0.1.0"
description = "Digitalizador de curvas de fabricante de bombas centrífugas (visión por computador clásica, sin IA)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "opencv-python-headless",
    "scikit-image",
    "pypdfium2",
    "pillow",
    "plotly",
    "nicegui",
    "openpyxl",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pytest-asyncio"]

[tool.setuptools.packages.find]
include = ["bombas*"]

[tool.setuptools.package-data]
bombas = ["ui/imagenes_guia/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Simulador de usuario de NiceGUI (tests de la interfaz sin navegador).
addopts = "-p nicegui.testing.user_plugin"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
main_file = ""
